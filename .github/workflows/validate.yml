name: Validate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  godot:
    name: Godot 4.7.1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GODOT_VERSION: 4.7.1
      GODOT_BUILD: stable
      GODOT_SHA256: c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned Godot editor
        shell: bash
        run: |
          archive="$RUNNER_TEMP/godot.zip"
          install_dir="$RUNNER_TEMP/godot"
          download_url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_BUILD}/Godot_v${GODOT_VERSION}-${GODOT_BUILD}_linux.x86_64.zip"

          curl --fail --location --retry 3 --output "$archive" "$download_url"
          echo "$GODOT_SHA256  $archive" | sha256sum --check
          mkdir --parents "$install_dir"
          unzip -q "$archive" -d "$install_dir"
          chmod +x "$install_dir/Godot_v${GODOT_VERSION}-${GODOT_BUILD}_linux.x86_64"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Confirm Godot version
        shell: bash
        run: |
          godot="$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-${GODOT_BUILD}_linux.x86_64"
          test "$("$godot" --version)" = "4.7.1.stable.official.a13da4feb"

      - name: Import and parse project
        shell: bash
        run: |
          godot="$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-${GODOT_BUILD}_linux.x86_64"
          "$godot" --headless --path . --import --verbose

      - name: Start main scene
        shell: bash
        run: |
          godot="$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-${GODOT_BUILD}_linux.x86_64"
          "$godot" --headless --path . --quit-after 120 --verbose
